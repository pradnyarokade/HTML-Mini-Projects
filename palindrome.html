<!DOCTYPE html>
<html>
<head>
  <title>Palindrome Checker</title>
</head>
<body style="margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #fbc2eb, #a6c1ee); height: 100vh; display: flex; justify-content: center; align-items: center;">

  <div style="background: white; padding: 40px; border-radius: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: 320px; text-align: center;">
    <h2 style="color: #444;">
	Palindrome Checker</h2>

    <input 
      type="text" 
      id="inputString" 
      placeholder="Enter a string" 
      style="width: 90%; padding: 12px; margin-top: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px;"
    >

    <button 
      onclick="checkPalindrome()" 
      style="margin-top: 20px; padding: 12px 24px; background-color: #6a11cb; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.3s;"
      onmouseover="this.style.backgroundColor='#4e0fbb'" 
      onmouseout="this.style.backgroundColor='#6a11cb'"
    >
      Check
    </button>

    <h3 id="result" style="margin-top: 25px; color: #222;"></h3>
  </div>

  <script>
    function checkPalindrome() {
      let str = document.getElementById("inputString").value;
      let cleaned = str.toLowerCase().replace(/[^a-z0-9]/g, '');
      let reversed = cleaned.split('').reverse().join('');

      if (cleaned.length === 0) {
        document.getElementById("result").innerText = "⚠️ Please enter a valid string.";
      } else if (cleaned === reversed) {
        document.getElementById("result").innerText = `✅ "${str}" is a palindrome.`;
      } else {
        document.getElementById("result").innerText = `❌ "${str}" is not a palindrome.`;
      }
    }
  </script>

</body>
</html>
